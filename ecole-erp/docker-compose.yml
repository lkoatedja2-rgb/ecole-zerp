version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecole-erp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecole
      POSTGRES_PASSWORD: ecole_pwd
      POSTGRES_DB: ecole_erp
    ports:
      - "5432:5432"
    volumes:
      - ecole_erp_pgdata:/var/lib/postgresql/data

volumes:
  ecole_erp_pgdata:
